name: Draw keymap
on:
  workflow_dispatch:
  push:
    paths:
      - config/planck.keymap
      - config/include/**
      - keymap_drawer.config.yaml
      - .github/workflows/draw.yml

concurrency:
  group: keymap-drawer-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@v0.23.0
    with:
      keymap_patterns: "config/planck.keymap"
      config_path: "keymap_drawer.config.yaml"
      output_folder: "keymap-drawer"
      draw_args: "planck:'-n 444444_444444'"
      commit_message: "keymap-drawer render"
