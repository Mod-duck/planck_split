name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    paths:
      - boards/**
      - config/**
      - src/**
      - CMakeLists.txt
      - Kconfig
      - build.yaml
      - zephyr/module.yml
      - .github/workflows/build.yml

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      archive_name: planck-firmware
